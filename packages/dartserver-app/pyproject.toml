[build-system]
requires = [ "setuptools>=68.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dartserver-app"
version = "1.0.0"
description = "Flask web application for Darts Game Server with real-time game management"
requires-python = ">=3.10"
dependencies = [ "dartserver-core>=1.0.0", "dartserver-games>=1.0.0", "dartserver-services>=1.0.0", "Flask>=3.0.0,<4.0.0", "Flask-CORS>=4.0.0,<5.0.0", "Flask-SocketIO>=5.3.0,<6.0.0", "Flasgger>=0.9.0,<1.0.0", "python-socketio>=5.9.0,<6.0.0", "python-engineio>=4.7.0,<5.0.0", "Werkzeug>=3.0.0,<4.0.0", "python-dotenv>=1.0.0,<2.0.0",]
keywords = [ "darts", "game", "flask", "websocket", "realtime", "api",]
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Framework :: Flask", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Games/Entertainment", "Topic :: Internet :: WWW/HTTP :: Dynamic Content",]
[[project.authors]]
name = "Dartserver Team"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.7.0",]

[project.urls]
Homepage = "https://github.com/letsplaydarts/dartserver-pythonapp"
Documentation = "https://github.com/letsplaydarts/dartserver-pythonapp/tree/main/packages/dartserver-app"
Repository = "https://github.com/letsplaydarts/dartserver-pythonapp.git"
Issues = "https://github.com/letsplaydarts/dartserver-pythonapp/issues"

[tool.black]
line-length = 100
target-version = [ "py310",]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "W",]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dartserver_app*"]

[tool.setuptools.package-data]
dartserver_app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = [ "test_*.py",]
addopts = "--cov=src/dartserver_app --cov-report=html --cov-report=term-missing"
