[build-system]
requires = [ "setuptools>=68.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dartserver-games"
version = "1.0.0"
description = "Game implementations for Darts application (301, Cricket, Round the Clock, etc)"
requires-python = ">=3.10"
dependencies = [ "dartserver-core>=1.0.0",]
keywords = [ "darts", "game", "301", "cricket", "rounds", "target",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Games/Entertainment", "Topic :: Software Development :: Libraries",]
[[project.authors]]
name = "Dartserver Team"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.7.0",]

[project.urls]
Homepage = "https://github.com/letsplaydarts/dartserver-pythonapp"
Documentation = "https://github.com/letsplaydarts/dartserver-pythonapp/tree/main/packages/dartserver-games"
Repository = "https://github.com/letsplaydarts/dartserver-pythonapp.git"
Issues = "https://github.com/letsplaydarts/dartserver-pythonapp/issues"

[tool.black]
line-length = 100
target-version = [ "py310",]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [ "E", "F", "W",]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools.package-discovery]
search-paths = [ "src",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = [ "test_*.py",]
addopts = "--cov=src/dartserver_games --cov-report=html --cov-report=term-missing"

[tool.setuptools.packages.find]
where = [ "src",]
include = [ "dartserver_games*",]
