[build-system]
requires = [ "setuptools>=68.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dartserver-services"
version = "1.0.0"
description = "Services module for Darts application (RabbitMQ, TTS, Dartboard, Mobile)"
requires-python = ">=3.10"
dependencies = [ "dartserver-core>=1.0.0", "pika>=1.3.2,<2.0.0", "gtts>=2.5.0,<3.0.0", "pyttsx3>=2.90,<3.0.0", "SQLAlchemy>=2.0.23,<3.0.0",]
keywords = [ "darts", "rabbitmq", "tts", "dartboard", "mobile", "service",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Communications :: Message Queuing", "Topic :: Multimedia :: Sound/Audio", "Topic :: Software Development :: Libraries",]
[[project.authors]]
name = "Dartserver Team"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.7.0",]

[project.urls]
Homepage = "https://github.com/letsplaydarts/dartserver-pythonapp"
Documentation = "https://github.com/letsplaydarts/dartserver-pythonapp/tree/main/packages/dartserver-services"
Repository = "https://github.com/letsplaydarts/dartserver-pythonapp.git"
Issues = "https://github.com/letsplaydarts/dartserver-pythonapp/issues"

[tool.black]
line-length = 100
target-version = [ "py310",]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [ "E", "F", "W",]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]

[tool.setuptools.packages.find]
where = [ "src",]
include = [ "dartserver_services*",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = [ "test_*.py",]
addopts = "--cov=src/dartserver_services --cov-report=html --cov-report=term-missing"
