[build-system]
requires = [ "setuptools>=68.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dartserver-core"
version = "1.0.0"
description = "Core authentication, configuration, and database module for Darts application"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "darts", "game", "authentication", "database", "wso2", "oauth2", "oidc",]
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Web Environment", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Natural Language :: English", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Software Development :: Libraries :: Application Frameworks", "Topic :: System :: Monitoring",]
dependencies = [ "Flask>=3.0.0,<4.0.0", "SQLAlchemy>=2.0.23,<3.0.0", "PyJWT>=2.8.0,<3.0.0", "requests>=2.31.0,<3.0.0", "python-dotenv>=1.0.0,<2.0.0", "psycopg2-binary>=2.9.9,<3.0.0", "alembic>=1.13.1,<2.0.0",]
[[project.authors]]
name = "Dartserver Team"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.12.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.7.0", "types-flask>=1.1.0", "types-requests>=2.31.0",]
test = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.12.0",]

[project.urls]
Homepage = "https://github.com/letsplaydarts/dartserver-pythonapp"
Documentation = "https://github.com/letsplaydarts/dartserver-pythonapp/tree/main/packages/dartserver-core"
Repository = "https://github.com/letsplaydarts/dartserver-pythonapp.git"
Issues = "https://github.com/letsplaydarts/dartserver-pythonapp/issues"

[tool.setuptools]
packages = [ "dartserver_core",]

[tool.black]
line-length = 150
target-version = [ "py310", "py311", "py312",]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-discovery]
search-paths = [ "src",]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [ "tests",]
python_files = [ "test_*.py",]
addopts = [ "--cov=dartserver_core", "--cov-report=term-missing", "--cov-report=html", "--strict-markers",]
filterwarnings = [ "error", "ignore::UserWarning", "ignore::DeprecationWarning",]

[tool.coverage.run]
source = [ "dartserver_core",]
omit = [ "*/tests/*",]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
