<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Dashboard - Darts Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_theme.css') }}">
</head>

<body>
    <div class="container">
        {% include '_user_header.html' %}
        <header>
            <h1>📊 Training Dashboard</h1>
            <div class="header-links">
                <a href="/" class="header-link">🎮 Main Game</a>
                <a href="/training" class="header-link">🎯 Training Mode</a>
                {% if 'admin' in user_roles %}
                <a href="/admin" class="header-link">🔧 Admin</a>
                {% endif %}
            </div>
        </header>

        <div class="main-grid">
            <div>
                <div class="control-grid-row">
                    <!-- Statistics Summary -->
                    <section class="section">
                        <h2>Training Statistics</h2>
                        <div id="stats-summary" class="summary-cards">
                            <div class="summary-card">
                                <h3>Total Sessions</h3>
                                <div id="total-sessions" class="stat-value">-</div>
                            </div>
                            <div class="summary-card">
                                <h3>Completed</h3>
                                <div id="completed-sessions" class="stat-value">-</div>
                            </div>
                            <div class="summary-card">
                                <h3>Avg Score/Throw</h3>
                                <div id="avg-score" class="stat-value">-</div>
                            </div>
                            <div class="summary-card">
                                <h3>Total Throws</h3>
                                <div id="total-throws" class="stat-value">-</div>
                            </div>
                        </div>
                    </section>

                    <!-- Training History -->
                    <section class="section full-width">
                        <h2>Training History</h2>
                        <div class="button-group" style="margin-bottom: 1rem;">
                            <button id="refresh-btn" class="btn-primary btn-auto-width">Refresh</button>
                        </div>
                        <div id="history-list" class="games-list" style="max-height: 500px; overflow-y: auto;">
                            <p>Loading training history...</p>
                        </div>
                    </section>
                </div>
            </div>
            <div>
                <!-- Right column intentionally left for future widgets/filters -->
            </div>
        </div>
    </div>

    <script>
        // Load statistics and history on page load
        document.addEventListener('DOMContentLoaded', function () {
            loadStatistics();
            loadHistory();
        });

        // Refresh button handler
        document.getElementById('refresh-btn').addEventListener('click', function () {
            loadStatistics();
            loadHistory();
        });

        async function loadStatistics() {
            try {
                const response = await fetch('/api/training/statistics');
                const data = await response.json();

                if (data.success) {
                    const stats = data.statistics;
                    document.getElementById('total-sessions').textContent = stats.total_sessions;
                    document.getElementById('completed-sessions').textContent = stats.completed_sessions;
                    document.getElementById('avg-score').textContent = stats.average_score_per_throw.toFixed(2);
                    document.getElementById('total-throws').textContent = stats.total_throws;
                } else {
                    console.error('Failed to load statistics:', data.error);
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/training/history');
                const data = await response.json();

                if (data.success) {
                    displayHistory(data.sessions);
                } else {
                    document.getElementById('history-list').innerHTML =
                        '<p style="color: #ff6b6b;">Failed to load history: ' + (data.error || 'Unknown error') + '</p>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history-list').innerHTML =
                    '<p style="color: #ff6b6b;">Error loading training history</p>';
            }
        }

        function displayHistory(sessions) {
            const historyList = document.getElementById('history-list');

            if (!sessions || sessions.length === 0) {
                historyList.innerHTML = '<p>No training sessions found. Start training to see your history!</p>';
                return;
            }

            let html = '<div style="display: flex; flex-direction: column; gap: 1rem;">';

            sessions.forEach(session => {
                const startDate = new Date(session.started_at);
                const finishDate = session.finished_at ? new Date(session.finished_at) : null;
                const duration = finishDate ? Math.round((finishDate - startDate) / 1000 / 60) : null;

                html += '<div style="background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);">';
                html += '<div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">';
                html += '<strong style="color: #00d4ff;">' + session.game_type.toUpperCase() + '</strong>';
                html += '<span style="color: ' + (session.completed ? '#00ff00' : '#ffa500') + ';">' +
                    (session.completed ? '✓ Completed' : '⏸ Incomplete') + '</span>';
                html += '</div>';

                html += '<div style="font-size: 0.875rem; color: #888; display: grid; gap: 0.25rem;">';
                html += '<div>📅 Started: ' + startDate.toLocaleString() + '</div>';

                if (finishDate) {
                    html += '<div>🏁 Finished: ' + finishDate.toLocaleString() + '</div>';
                    html += '<div>⏱️ Duration: ' + duration + ' minutes</div>';
                }

                if (session.start_score !== null) {
                    html += '<div>🎯 Start Score: ' + session.start_score + '</div>';
                    if (session.final_score !== null) {
                        html += '<div>🎯 Final Score: ' + session.final_score + '</div>';
                    }
                }

                html += '<div>🎲 Throws: ' + session.throws_count + '</div>';

                if (session.double_out_enabled) {
                    html += '<div>🎯 Double Out: Enabled</div>';
                }

                html += '</div>';
                html += '</div>';
            });

            html += '</div>';
            historyList.innerHTML = html;
        }
    </script>
</body>

</html>
