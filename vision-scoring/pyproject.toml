[build-system]
requires = [ "setuptools>=68.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "vision-scoring"
version = "0.1.0"
description = "Camera-based dart scoring service for Dartserver (OpenCV vision pipeline)"
requires-python = ">=3.10"
dependencies = [ "opencv-python-headless>=4.9.0,<5.0.0", "numpy>=1.26.0,<2.0.0", "requests>=2.31.0,<3.0.0", "flask>=3.0.0,<4.0.0", "gunicorn>=21.2.0,<22.0.0",]
keywords = [ "darts", "vision", "opencv", "scoring", "camera",]
classifiers = [ "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Multimedia :: Video :: Capture",]

[[project.authors]]
name = "Dartserver Team"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pytest>=7.4.0", "pytest-cov>=4.1.0", "black>=23.0.0", "ruff>=0.1.0", "mypy>=1.7.0",]

[project.urls]
Homepage = "https://github.com/letsplaydarts/dartserver-pythonapp"
Documentation = "https://github.com/letsplaydarts/dartserver-pythonapp/tree/main/vision-scoring"
Repository = "https://github.com/letsplaydarts/dartserver-pythonapp.git"
Issues = "https://github.com/letsplaydarts/dartserver-pythonapp/issues"

[tool.black]
line-length = 100
target-version = [ "py310",]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "W",]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]

[tool.setuptools.packages.find]
where = [ "src",]
include = [ "vision_scoring*",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
python_files = [ "test_*.py",]
addopts = "--cov=src/vision_scoring --cov-report=html --cov-report=term-missing"
