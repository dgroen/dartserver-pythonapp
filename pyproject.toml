[project]
name = "dartserver-pythonapp"
version = "1.0.0"
description = "Darts Game Web Application with RabbitMQ integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dartserver Team"}
]
keywords = ["darts", "game", "rabbitmq", "flask", "socketio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "flask>=3.0.0,<4.0.0",
    "flask-socketio>=5.3.5,<6.0.0",
    "flask-cors>=4.0.0,<5.0.0",
    "pika>=1.3.2,<2.0.0",
    "python-socketio>=5.10.0,<6.0.0",
    "eventlet>=0.33.3,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyttsx3>=2.90,<3.0.0",
    "gtts>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "flasgger>=0.9.7.1,<1.0.0",
    "alembic>=1.13.1,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-flask>=1.3.0",
    "pytest-timeout>=2.2.0",
    "coverage[toml]>=7.3.0",
]
lint = [
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "pylint>=3.0.0",
    "flake8>=6.1.0",
    "flake8-docstrings>=1.7.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.14.0",
    "flake8-simplify>=0.21.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
]
test = [
    "tox>=4.11.0",
    "tox-uv>=1.0.0",
]
all = [
    "dartserver-pythonapp[dev,lint,test]",
]

[project.scripts]
dartserver = "app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "examples", "examples.*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = [
    "build/",
    "dist/",
    "docs/",
    ".tox/",
    ".venv/",
    "venv/",
    "__pycache__/",
    ".*\\.md$",
]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["union-attr"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0
limit-inference-results = 100
persistent = true
unsafe-load-any-extension = false

[tool.pylint.messages_control]
disable = [
    "C0103",   # invalid-name
    "C0114",   # missing-module-docstring
    "C0115",   # missing-class-docstring
    "C0116",   # missing-function-docstring
    "C0302",   # too-many-lines
    "C0415",   # import-outside-toplevel
    "E0401",   # import-error (dependencies not in pre-commit env)
    "E1101",   # no-member (false positives from dynamic types)
    "E1102",   # not-callable (false positives from SQLAlchemy)
    "R0401",   # cyclic-import
    "R0801",   # duplicate-code
    "R0902",   # too-many-instance-attributes
    "R0903",   # too-few-public-methods
    "R0911",   # too-many-return-statements
    "R0912",   # too-many-branches
    "R0913",   # too-many-arguments
    "R1702",   # too-many-nested-blocks
    "W0101",   # unreachable (false positives)
    "W0212",   # protected-access
    "W0401",   # wildcard-import
    "W0404",   # reimported
    "W0511",   # fixme
    "W0603",   # global-statement
    "W0614",   # unused-wildcard-import
    "W0621",   # redefined-outer-name
    "W0706",   # try-except-raise
    "W0718",   # broad-exception-caught
    "W1203",   # logging-fstring-interpolation
    "W1508",   # invalid-envvar-default
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 6
max-statements = 60
min-public-methods = 1

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:build/coverage/html",
    "--cov-report=xml:build/coverage/coverage.xml",
    "--cov-report=json:build/coverage/coverage.json",
    "--cov-branch",
    "--cov-fail-under=60",
    "--junit-xml=build/reports/junit.xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "rabbitmq: Tests requiring RabbitMQ",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
timeout = 300

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.venv/*",
    "*/.tox/*",
    "*/examples/*",
    "*/build/*",
    "*/docs/*",
    "*/alembic/*",
    "verify_installation.py",
    "verify_tts_integration.py",
    "test_rabbitmq.py",
    "test_tts*.py",
    "db_manage.py",
    "setup.py",
    "bridge_nodejs_to_rabbitmq.js",
    "api_gateway.py",
    "src/api_gateway/*",
]
branch = true
parallel = true
data_file = "build/coverage/.coverage"

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "build/coverage/html"

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.json]
output = "build/coverage/coverage.json"

[tool.bandit]
exclude_dirs = ["tests", "examples", ".tox", ".venv", "venv", "helpers"]
exclude = ["test_rabbitmq.py", "verify_installation.py"]
skips = ["B101", "B104", "B311", "B601"]
