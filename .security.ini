# Security scanning configuration

[bandit]
# Bandit security scanner configuration
# See: https://bandit.readthedocs.io/

exclude_dirs = ['tests', 'venv', '.venv']
tests = ['B201', 'B301', 'B302', 'B303', 'B304', 'B305', 'B306']

[safety]
# Safety dependency scanner configuration
# See: https://pyup.io/safety/

# Scan for vulnerabilities in all dependencies
scan_all = true

# Ignore specific advisory IDs (if necessary)
# ignore = []
