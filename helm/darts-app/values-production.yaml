# Production values for darts-app
# Override default values for production environment

global:
  environment: production

# Production image tags
image:
  dartsApp:
    tag: "v1.0.0"
  apiGateway:
    tag: "v1.0.0"

# Higher resource limits for production
dartsApp:
  replicaCount: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  autoscaling:
    minReplicas: 3
    maxReplicas: 20

apiGateway:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    minReplicas: 3
    maxReplicas: 15

# Production database with larger storage
postgres:
  storage:
    size: 100Gi
    storageClass: gp3
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# Production RabbitMQ
rabbitmq:
  storage:
    size: 50Gi
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# Enable TLS
ingress:
  tls:
    - secretName: darts-app-tls
      hosts:
        - letsplaydarts.eu
        - wso2.letsplaydarts.eu

# Production security settings
config:
  flask:
    debug: "False"
  wso2:
    verifySSL: "True"
