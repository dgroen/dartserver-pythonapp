        required: true
        schema:
          properties:
            double_out:
              default: false
              description: Whether to require double-out to finish (only for 170/301/401/501)
              type: boolean
            game_type:
              default: '301'
              description: Type of game to start
              enum:
              - '170'
              - '301'
              - '401'
              - '501'
