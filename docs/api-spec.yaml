openapi: 3.0.3
info:
  title: Darts Game API
  description: 'REST API for the Darts Game System with comprehensive dartboard, game
    management, and mobile support.


    ## Authentication

    OAuth2 via WSO2 Identity Server. Include access token: `Authorization: Bearer
    <token>`


    ## Features

    - Game Management (301, 501, Cricket, Round the Clock)

    - Dual Score Formats (legacy + GPIO pin mapping)

    - Player Management with WSO2

    - Dartboard Zone Configuration

    - TTS Integration

    - Mobile API

    - History & Statistics

    '
  version: 2.0.0
  contact:
    url: https://test.letsplaydarts.eu
servers:
- url: https://test.letsplaydarts.eu
  description: Test server
- url: http://localhost:5000
  description: Local development
tags:
- name: Health
- name: Game Management
- name: Scores
- name: Players
- name: Dartboard
- name: Admin
- name: TTS
- name: Mobile
- name: History
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      security: []
      responses:
        '200':
          description: Service healthy
  /api/game/state:
    get:
      tags:
      - Game Management
      summary: Get current game state
      responses:
        '200':
          description: Current game state
  /api/game/new:
    post:
      tags:
      - Game Management
      summary: Create new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - game_type
              - players
              properties:
                game_type:
                  type: string
                  enum:
                  - '301'
                  - '401'
                  - '501'
                  - cricket
                  - round_the_clock
                players:
                  type: array
                  items:
                    type: object
                    properties:
                      username:
                        type: string
                      name:
                        type: string
                double_out:
                  type: boolean
      responses:
        '200':
          description: Game created
  /api/game/start:
    post:
      tags:
      - Game Management
      - Mobile
      summary: Start game (mobile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                game_type:
                  type: string
                players:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Game started
  /api/game/end:
    post:
      tags:
      - Game Management
      - Mobile
      summary: End current game
      responses:
        '200':
          description: Game ended
  /api/game/current:
    get:
      tags:
      - Game Management
      - Mobile
      summary: Get current game
      responses:
        '200':
          description: Current game info
  /api/game/types:
    get:
      tags:
      - Game Management
      - Mobile
      summary: List game types
      responses:
        '200':
          description: Available game types
  /api/game/results:
    get:
      tags:
      - Game Management
      - Mobile
      summary: Get game results
      responses:
        '200':
          description: Game results
  /api/game/current/session_id:
    get:
      tags:
      - Game Management
      summary: Get session ID
      responses:
        '200':
          description: Current session ID
  /api/games:
    get:
      tags:
      - Game Management
      - Multi-Game
      summary: List all game sessions
      description: Returns all active tracked game sessions and the current active_game_id
      responses:
        '200':
          description: List of game sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        game_id:
                          type: string
                        game_type:
                          type: string
                        is_started:
                          type: boolean
                        is_active:
                          type: boolean
                        player_count:
                          type: integer
                        players:
                          type: array
                          items:
                            type: object
                            properties:
                              db_id:
                                type: integer
                              name:
                                type: string
                  active_game_id:
                    type: string
                    nullable: true
  /api/games/create:
    post:
      tags:
      - Game Management
      - Multi-Game
      summary: Create a new game session
      description: Creates a new multi-game session (optionally starts a game in it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                game_id:
                  type: string
                  description: Optional session id; auto-generated when omitted
                game_type:
                  type: string
                  description: Type of game to start
                  enum:
                  - '301'
                  - '401'
                  - '501'
                  - cricket
                  - round_the_clock
                  - round_the_clock_double
                players:
                  type: array
                  items:
                    type: string
                  description: List of player names or usernames
                double_out:
                  type: boolean
                reset_on_miss:
                  type: boolean
                set_as_active:
                  type: boolean
      responses:
        '200':
          description: Game session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  game_id:
                    type: string
  /api/games/{game_id}/activate:
    post:
      tags:
      - Game Management
      - Multi-Game
      summary: Activate a game session
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Game activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  game_id:
                    type: string
        '404':
          description: Game not found
  /api/games/{game_id}:
    delete:
      tags:
      - Game Management
      - Multi-Game
      summary: Delete a game session
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Game deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
        '400':
          description: Cannot delete default game or invalid request
        '404':
          description: Game not found
  /api/games/{game_id}/state:
    get:
      tags:
      - Game Management
      - Multi-Game
      summary: Get state of a specific game session
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Game state retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '404':
          description: Game not found
  /api/v1/scores:
    post:
      tags:
      - Scores
      summary: Submit score (gateway)
      description: Submits score via the API Gateway (validates token and publishes
        message to RabbitMQ).
      security:
      - oauth2:
        - score:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - score
              - multiplier
              properties:
                score:
                  type: integer
                  minimum: 0
                  maximum: 60
                multiplier:
                  type: string
                  enum:
                  - SINGLE
                  - DOUBLE
                  - TRIPLE
                player_id:
                  type: integer
                game_id:
                  type: string
      responses:
        '201':
          description: Score accepted and published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Score submitted successfully
                  data:
                    type: object
                    properties:
                      score:
                        type: integer
                      multiplier:
                        type: string
                      player_id:
                        type: integer
                      game_id:
                        type: string
                      user:
                        type: string
                        description: User identifier from token claims
                      timestamp:
                        type: string
                        format: date-time
  /api/v1/games:
    post:
      tags:
      - Game Management
      summary: Create game (gateway)
      description: Create a new game via API Gateway (publishes to RabbitMQ).
      security:
      - oauth2:
        - game:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - game_type
              - players
              properties:
                game_type:
                  type: string
                players:
                  type: array
                  items:
                    type: object
                    properties:
                      username:
                        type: string
                      name:
                        type: string
                  description: List of player objects (username/name). May also accept
                    plain strings in some clients.
      responses:
        '201':
          description: Game created and published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Game created successfully
                  data:
                    type: object
                    properties:
                      action:
                        type: string
                        example: new_game
                      game_type:
                        type: string
                      players:
                        type: array
                        items:
                          type: object
                      double_out:
                        type: boolean
                      created_by:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
  /api/v1/players:
    post:
      tags:
      - Players
      summary: Add player (gateway)
      description: Adds a player via the API Gateway (publishes to RabbitMQ).
      security:
      - oauth2:
        - player:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: Player added and published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Player added successfully
                  data:
                    type: object
                    properties:
                      action:
                        type: string
                        example: add_player
                      name:
                        type: string
                      added_by:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes:
            openid: OpenID Connect
            profile: User profile
            game:create: Create games
            game:manage: Manage games
            player:manage: Manage players
            admin: Admin access
security:
- oauth2: []
