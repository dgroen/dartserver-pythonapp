name: Unified Deployment Pipeline

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dartserver-config
          path: dartserver-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Unlock git-crypt (config repo)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "${GIT_CRYPT_KEY}" ]; then
            echo "❌ GIT_CRYPT_KEY secret is missing; cannot decrypt config repository"
            exit 1
          fi
          echo "🔑 Unlocking git-crypt..."
          echo "${GIT_CRYPT_KEY}" | base64 -d > /tmp/git-crypt.key
          cd dartserver-config
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      - name: Decrypt config repository
        run: |
          cd dartserver-config
          chmod +x scripts/decrypt-configs.sh
          ./scripts/decrypt-configs.sh

      - name: Normalize and bundle test config
        run: |
          normalize_env() {
            ENV_PATH="$1"
            if [ -f "$ENV_PATH" ]; then
              TMP_ENV=$(mktemp)
              if iconv -f UTF-8 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              elif iconv -f ISO-8859-1 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              else
                cp "$ENV_PATH" "$TMP_ENV"
              fi
              perl -0777 -pe 's/^\xEF\xBB\xBF//' "$TMP_ENV" > "$ENV_PATH"
              rm -f "$TMP_ENV"
            fi
          }

          normalize_env "dartserver-config/environments/test/.env"

          tar czf /tmp/dartserver-config.tgz -C dartserver-config environments/test

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jumphost_key

          # Configure SSH config for jumphost setup
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host jumphost
            HostName ${{ secrets.JUMPHOST_HOST }}
            User ${{ secrets.JUMPHOST_USER }}
            IdentityFile ~/.ssh/jumphost_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            LogLevel FATAL
            PasswordAuthentication no

          Host test-server
            HostName ${{ secrets.TEST_SERVER_HOST }}
            Port ${{ secrets.TEST_SERVER_PORT }}
            User ${{ secrets.TEST_SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyJump jumphost
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            LogLevel FATAL
          SSHCONFIG

          chmod 600 ~/.ssh/config

      - name: Test SSH Connectivity
        run: |
          echo "=== Key info: jumphost_key ==="
          echo "-- Type / fingerprint (SHA256) --"
          ssh-keygen -l -f ~/.ssh/jumphost_key \
            || echo "WARNING: could not read jumphost_key fingerprint"
          echo "-- Fingerprint (MD5) --"
          ssh-keygen -l -E md5 -f ~/.ssh/jumphost_key \
            || echo "WARNING: could not compute MD5 fingerprint"
          echo "-- Derived public key (safe to share) --"
          ssh-keygen -y -f ~/.ssh/jumphost_key \
            || echo "WARNING: could not derive public key from jumphost_key"

          echo ""
          echo "=== Key info: deploy_key ==="
          echo "-- Type / fingerprint (SHA256) --"
          ssh-keygen -l -f ~/.ssh/deploy_key \
            || echo "WARNING: could not read deploy_key fingerprint"
          echo "-- Fingerprint (MD5) --"
          ssh-keygen -l -E md5 -f ~/.ssh/deploy_key \
            || echo "WARNING: could not compute MD5 fingerprint"
          echo "-- Derived public key (safe to share) --"
          echo ">>> Copy this line and compare it with authorized_keys on the test server <<<"
          ssh-keygen -y -f ~/.ssh/deploy_key \
            || echo "WARNING: could not derive public key from deploy_key"

          echo ""
          echo "=== Secret values (hex encoded to bypass log masking) ==="
          echo -n "TEST_SERVER_USER (hex): "
          printf '%s' "${{ secrets.TEST_SERVER_USER }}" | od -A n -t x1 | tr -d ' \n' && echo
          echo -n "TEST_SERVER_HOST (hex): "
          printf '%s' "${{ secrets.TEST_SERVER_HOST }}" | od -A n -t x1 | tr -d ' \n' && echo
          echo -n "TEST_SERVER_PORT (hex): "
          printf '%s' "${{ secrets.TEST_SERVER_PORT }}" | od -A n -t x1 | tr -d ' \n' && echo

          echo ""
          echo "=== Resolved SSH config ==="
          cat ~/.ssh/config

          echo ""
          echo "=== Testing jumphost connectivity ==="
          ssh -vvv -o BatchMode=yes jumphost echo "jumphost reachable" 2>&1 \
            && echo "✅ Jumphost OK" \
            || { echo "❌ Jumphost connection FAILED (see verbose output above)"; exit 1; }

          echo ""
          echo "=== Testing test-server connectivity via jumphost ==="
          ssh -vvv -o BatchMode=yes test-server echo "test-server reachable" 2>&1 \
            && echo "✅ test-server OK" \
            || { echo "❌ test-server connection FAILED (see verbose output above)"; exit 1; }

          echo ""
          echo "=== Local testing guide ==="
          echo "Replicate this test locally (fill in your actual secret values):"
          echo ""
          echo "  # 1. Write the keys"
          echo "  echo '<JUMPHOST_SSH_KEY>' > /tmp/jumphost_key && chmod 600 /tmp/jumphost_key"
          echo "  echo '<TEST_SERVER_SSH_KEY>' > /tmp/deploy_key && chmod 600 /tmp/deploy_key"
          echo ""
          echo "  # 2. Test jumphost connection"
          echo "  ssh -vvv -i /tmp/jumphost_key \\"
          echo "    -o IdentitiesOnly=yes \\"
          echo "    -o StrictHostKeyChecking=no \\"
          echo "    -o UserKnownHostsFile=/dev/null \\"
          echo "    -o PubkeyAcceptedKeyTypes=+ssh-rsa \\"
          echo "    -o HostKeyAlgorithms=+ssh-rsa \\"
          echo "    -o BatchMode=yes \\"
          echo "    <JUMPHOST_USER>@<JUMPHOST_HOST> echo OK"
          echo ""
          echo "  # 3. Test test-server connection via jumphost"
          echo "  ssh -vvv -i /tmp/deploy_key \\"
          echo "    -o IdentitiesOnly=yes \\"
          echo "    -o StrictHostKeyChecking=no \\"
          echo "    -o UserKnownHostsFile=/dev/null \\"
          echo "    -o BatchMode=yes \\"
          echo "    -o 'ProxyCommand=ssh -i /tmp/jumphost_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -W %h:%p <JUMPHOST_USER>@<JUMPHOST_HOST>' \\"
          echo "    -p <TEST_SERVER_PORT> <TEST_SERVER_USER>@<TEST_SERVER_HOST> echo OK"

      - name: Inspect config repo layout
        run: |
          ls -la dartserver-config
          find dartserver-config -maxdepth 3 -type d

      - name: Send config bundle to test server
        run: |
          if [ ! -f /tmp/dartserver-config.tgz ]; then
            echo "❌ /tmp/dartserver-config.tgz not found"
            exit 1
          fi
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/dartserver-config.tgz test-server:/tmp/dartserver-config.tgz
          echo "✅ Test config bundle uploaded to test-server"

      - name: Deploy to Test Server
        env:
          TEST_SERVER_HOST: test-server
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key ${TEST_SERVER_HOST} \
            "bash -s" << 'ENDSSH'
          set -e
          echo "🚀 Starting deployment to test environment..."

          # Navigate to application directory
          cd /opt/dartserver-pythonapp || \
            { echo "❌ Application directory not found"; exit 1; }

          normalize_env() {
            ENV_PATH="$1"
            if [ -f "$ENV_PATH" ]; then
              TMP_ENV=$(mktemp)
              if iconv -f UTF-8 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              elif iconv -f ISO-8859-1 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              else
                cp "$ENV_PATH" "$TMP_ENV"
              fi
              perl -0777 -pe 's/^\xEF\xBB\xBF//' "$TMP_ENV" > "$ENV_PATH"
              rm -f "$TMP_ENV"
            fi
          }

          # Refresh config bundle from runner
          if [ -f /tmp/dartserver-config.tgz ]; then
            rm -rf dartserver-config
            mkdir -p dartserver-config
            tar xzf /tmp/dartserver-config.tgz -C dartserver-config
          fi

          # Stop existing containers first (to release file locks)
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose-wso2.yml -f docker-compose-test.yml down || true

          # Pull latest code BEFORE copying config files, so there are no local
          # modifications that would cause git checkout to fail
          echo "📥 Pulling latest changes from test branch..."
          TARGET_BRANCH="test"
          git fetch origin "${TARGET_BRANCH}"
          # Force-clean local modifications left by previous/manual runs.
          git reset --hard
          git clean -fd
          git checkout -f -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          git clean -fd
          echo "✅ Active branch: $(git branch --show-current)"
          echo "✅ Active commit: $(git rev-parse --short HEAD)"

          # Copy configuration files from config repository (fresh bundle)
          # This intentionally overrides tracked files (nginx.conf, SSL certs, etc.)
          echo "📝 Copying configuration files from config repository..."
          rm -rf ./wso2is-7-config ./ssl ./nginx
          cp dartserver-config/environments/test/.env ./.env
          mkdir -p ./wso2is-7-config ./ssl ./nginx
          cp -r dartserver-config/environments/test/wso2is-config/. ./wso2is-7-config/
          cp -r dartserver-config/environments/test/ssl/. ./ssl/

          # Fail fast if required WSO2 SQL seed files are missing/invalid.
          for required_sql in ./wso2is-7-config/postgresql-shared.sql ./wso2is-7-config/postgresql-identity.sql; do
            if [ ! -s "${required_sql}" ]; then
              echo "❌ Missing or empty required WSO2 SQL file: ${required_sql}"
              exit 1
            fi
          done
          if ! grep -q "CREATE TABLE UM_ROLE" ./wso2is-7-config/postgresql-shared.sql; then
            echo "❌ Invalid shared SQL seed: CREATE TABLE UM_ROLE not found"
            exit 1
          fi
          if ! grep -q "IDN_CLAIM_MAPPED_ATTRIBUTE" ./wso2is-7-config/postgresql-identity.sql; then
            echo "❌ Invalid identity SQL seed: IDN_CLAIM_MAPPED_ATTRIBUTE not found"
            exit 1
          fi
          nginx_conf_src=""
          for candidate in \
            dartserver-config/environments/test/nginx/nginx.conf \
            dartserver-config/environments/test/nginx/nginx/nginx.conf; do
            if [ -f "${candidate}" ]; then
              nginx_conf_src="${candidate}"
              break
            fi
          done

          nginx_crt_src=""
          for candidate in \
            dartserver-config/environments/test/nginx/nginx.crt \
            dartserver-config/environments/test/nginx/cert.pem \
            dartserver-config/environments/test/nginx/nginx/nginx.crt \
            dartserver-config/environments/test/nginx/nginx/cert.pem \
            dartserver-config/environments/test/nginx/nginx/ssl/nginx.crt \
            dartserver-config/environments/test/nginx/nginx/ssl/cert.pem; do
            if [ -f "${candidate}" ]; then
              nginx_crt_src="${candidate}"
              break
            fi
          done

          nginx_key_src=""
          for candidate in \
            dartserver-config/environments/test/nginx/nginx.key \
            dartserver-config/environments/test/nginx/key.pem \
            dartserver-config/environments/test/nginx/nginx/nginx.key \
            dartserver-config/environments/test/nginx/nginx/key.pem \
            dartserver-config/environments/test/nginx/nginx/ssl/nginx.key \
            dartserver-config/environments/test/nginx/nginx/ssl/key.pem; do
            if [ -f "${candidate}" ]; then
              nginx_key_src="${candidate}"
              break
            fi
          done

          if [ -z "${nginx_conf_src}" ] || [ -z "${nginx_crt_src}" ] || [ -z "${nginx_key_src}" ]; then
            echo "❌ Could not resolve nginx asset files from config bundle"
            echo "Resolved values: nginx_conf_src='${nginx_conf_src}', nginx_crt_src='${nginx_crt_src}', nginx_key_src='${nginx_key_src}'"
            find dartserver-config/environments/test/nginx -maxdepth 4 -mindepth 1 -ls || true
            exit 1
          fi

          echo "ℹ️ Using nginx assets: conf='${nginx_conf_src}', crt='${nginx_crt_src}', key='${nginx_key_src}'"

          install -m 0644 "${nginx_conf_src}" ./nginx/nginx.conf
          install -m 0644 "${nginx_crt_src}" ./nginx/nginx.crt
          install -m 0644 "${nginx_key_src}" ./nginx/nginx.key
          chmod 0600 ./nginx/nginx.key

          echo "🔧 Normalizing .env encoding to UTF-8 (strip BOM, convert Latin-1 if needed)..."
          normalize_env ".env"

          # Clone or update dartserver-website (sibling directory)
          echo "📦 Setting up dartserver-website..."
          WEBSITE_DIR="$(dirname $(pwd))/dartserver-website"
          if git -C "${WEBSITE_DIR}" rev-parse --git-dir > /dev/null 2>&1; then
            echo "  → Pulling latest dartserver-website..."
            git -C "${WEBSITE_DIR}" fetch origin
            git -C "${WEBSITE_DIR}" checkout main
            git -C "${WEBSITE_DIR}" pull origin main
          else
            echo "  → Cloning dartserver-website..."
            rm -rf "${WEBSITE_DIR}"
            git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/dartserver-website.git "${WEBSITE_DIR}"
          fi
          # Rebuild containers (build services individually to avoid context issues)
          echo "🔨 Rebuilding containers..."
          docker-compose -f docker-compose-wso2.yml build --no-cache darts-app
          docker-compose -f docker-compose-wso2.yml build --no-cache api-gateway

          # Start infrastructure first so bootstrap can create or repair WSO2 state
          echo "▶️  Starting infrastructure services..."
          docker-compose -f docker-compose-wso2.yml -f docker-compose-test.yml up -d postgres rabbitmq wso2is wso2apim

          # Do not re-run docker-entrypoint init SQL on existing databases.
          # Those scripts contain DROP statements and are only safe during first-time
          # initialization of a fresh PostgreSQL data directory.

          # Ensure WSO2 user-store schema and bootstrap data exist before the apps start
          echo "🛠️  Verifying and repairing WSO2 PostgreSQL schema and bootstrap data..."
          if [ -f helpers/setup-test-environment.sh ]; then
            # setup-test-environment.sh is non-destructive: it only initializes
            # missing databases/schemas and never drops existing entities.
            STRICT_WSO2_BOOTSTRAP=true WSO2_IS_INTERNAL_URL=https://localhost:9443 bash helpers/setup-test-environment.sh || { echo "❌ WSO2 bootstrap failed"; exit 1; }
          else
            echo "❌ helpers/setup-test-environment.sh not found! Cannot bootstrap WSO2 test environment."
            exit 1
          fi

          if ! docker exec darts-postgres psql -U postgres -d wso2is_shared -tAc "SELECT to_regclass('public.um_domain');" | grep -q "um_domain"; then
            echo "❌ WSO2 schema verification failed: table um_domain is missing in wso2is_shared"
            exit 1
          fi

          echo "🛠️  Repairing WSO2 claim mappings after startup..."
          if [ -f helpers/setup-test-environment.sh ]; then
            WSO2_POST_START_REPAIR=true WSO2_IS_INTERNAL_URL=https://localhost:9443 bash helpers/setup-test-environment.sh || { echo "❌ WSO2 claim repair failed"; exit 1; }
          else
            echo "❌ helpers/setup-test-environment.sh not found! Cannot repair WSO2 claim mappings."
            exit 1
          fi

          echo "🔎 Validating WSO2 baseline data (roles and claim mappings)..."
          CORE_ROLE_COUNT=$(docker exec darts-postgres psql -U postgres -d wso2is_shared -tAc "SELECT COUNT(*) FROM um_role WHERE um_role_name IN ('admin','everyone');" | tr -d '[:space:]')
          USERNAME_MAPPING_COUNT=$(docker exec darts-postgres psql -U postgres -d wso2is_identity -tAc "
            SELECT COUNT(*)
            FROM idn_claim c
            JOIN idn_claim_mapped_attribute m
              ON m.local_claim_id = c.id AND m.tenant_id = c.tenant_id
            WHERE c.claim_uri = 'http://wso2.org/claims/username'
              AND m.user_store_domain_name = 'PRIMARY';
          " | tr -d '[:space:]')
          ADDRESSES_MAPPING_COUNT=$(docker exec darts-postgres psql -U postgres -d wso2is_identity -tAc "
            SELECT COUNT(*)
            FROM idn_claim c
            JOIN idn_claim_mapped_attribute m
              ON m.local_claim_id = c.id AND m.tenant_id = c.tenant_id
            WHERE c.claim_uri = 'http://wso2.org/claims/addresses'
              AND m.user_store_domain_name = 'PRIMARY';
          " | tr -d '[:space:]')

          if [ "${CORE_ROLE_COUNT}" -lt 1 ] || [ "${USERNAME_MAPPING_COUNT}" -lt 1 ] || [ "${ADDRESSES_MAPPING_COUNT}" -lt 1 ]; then
            echo "❌ WSO2 baseline validation failed"
            echo "  - core roles(admin/everyone): ${CORE_ROLE_COUNT}"
            echo "  - username claim mappings: ${USERNAME_MAPPING_COUNT}"
            echo "  - addresses claim mappings: ${ADDRESSES_MAPPING_COUNT}"
            echo "  Recent WSO2 logs:"
            docker logs --tail 200 darts-wso2is || true
            exit 1
          fi
          echo "✅ WSO2 baseline data validation passed"

          # Start the public application services once, after bootstrap and migration use the final env
          # Note: docker-entrypoint.sh runs alembic upgrade head automatically on startup.
          echo "▶️  Starting darts app, gateway, and nginx..."
          docker-compose -f docker-compose-wso2.yml -f docker-compose-test.yml up -d darts-app api-gateway nginx

          # Check container status
          echo "✅ Checking container status..."
          docker-compose -f docker-compose-wso2.yml -f docker-compose-test.yml ps

          echo "🎉 Deployment to test environment completed successfully!"
          ENDSSH

      - name: Verify Test Deployment
        env:
          TEST_SERVER_HOST: test-server
        run: |
          ssh -i ~/.ssh/deploy_key ${TEST_SERVER_HOST} << 'ENDSSH'
            cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

            echo "Branch: $(git branch --show-current)"
            echo "Commit: $(git rev-parse --short HEAD)"

            # Check if containers are running
            RUNNING_CONTAINERS=$(docker-compose -f docker-compose-wso2.yml \
              -f docker-compose-test.yml ps --services --filter "status=running" | wc -l)
            echo "Running containers: $RUNNING_CONTAINERS"

            if [ "$RUNNING_CONTAINERS" -lt 1 ]; then
              echo "❌ Not all containers are running"
              exit 1
            fi

            echo "✅ All containers are running"
          ENDSSH

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/jumphost_key

  approval-gate:
    name: Approval Gate for Production
    runs-on: ubuntu-latest
    needs: deploy-test
    environment:
      name: production-approval
      # NOTE: This environment MUST be configured in GitHub Settings -> Environments
      # with Required Reviewers enabled, or the workflow will not wait for approval
    steps:
      - name: Wait for Approval
        run: |
          echo "✅ Test deployment successful"
          echo "⏸️  Waiting for manual approval to deploy to production..."
          echo "⚠️  If this step doesn't pause, check GitHub Settings -> Environments"
          echo "Review the test environment before approving this deployment"

  backup-production:
    name: Backup Production Before Deployment
    runs-on: ubuntu-latest
    needs: approval-gate
    outputs:
      backup_path: ${{ steps.backup.outputs.backup_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jumphost_key

          cat > ~/.ssh/config << 'SSHCONFIG'
          Host jumphost
            HostName ${{ secrets.JUMPHOST_HOST }}
            User ${{ secrets.JUMPHOST_USER }}
            IdentityFile ~/.ssh/jumphost_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            LogLevel FATAL
            PasswordAuthentication no

          Host prod-server
            HostName ${{ secrets.PROD_SERVER_HOST }}
            Port ${{ secrets.PROD_SERVER_PORT }}
            User ${{ secrets.PROD_SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyJump jumphost
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            LogLevel FATAL
          SSHCONFIG

          chmod 600 ~/.ssh/config

      - name: Create Full Backup
        id: backup
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          BACKUP_DATE=$(date +%Y-%m-%d)
          BACKUP_TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)

          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} bash -s << 'ENDSSH'
          set -e
          cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

          # Check if backup already exists for today
          EXISTING_BACKUP=\$(find docker-backups -maxdepth 1 -type d -name "${BACKUP_DATE}*" 2>/dev/null | head -1)

          if [ -n "\${EXISTING_BACKUP}" ]; then
            echo "ℹ️  Backup already exists for today: \${EXISTING_BACKUP}"
            echo "⏭️  Skipping backup creation"
            echo "\${EXISTING_BACKUP}" > /tmp/latest_backup_path.txt
          else
            echo "💾 Creating full backup before production deployment..."
            echo "Backup timestamp: ${BACKUP_TIMESTAMP}"

            # Make backup script executable
            chmod +x helpers/backup_docker_volumes.sh

            # Run backup with auto-confirm
            ./helpers/backup_docker_volumes.sh -y

            # Get the latest backup directory
            LATEST_BACKUP=\$(ls -dt docker-backups/*/ | head -1)
            echo "✅ Backup created: \${LATEST_BACKUP}"

            # Store backup path in a file for later retrieval
            echo "\${LATEST_BACKUP}" > /tmp/latest_backup_path.txt

            # Keep only the last 5 backups, remove older ones
            echo "🧹 Cleaning up old backups (keeping last 5)..."
            ls -dt docker-backups/*/ | tail -n +6 | while read OLD_BACKUP; do
              echo "   Removing: \${OLD_BACKUP}"
              rm -rf "\${OLD_BACKUP}"
            done
          fi
          ENDSSH

          echo "✅ Production backup check completed"

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/jumphost_key

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: backup-production
    environment:
      name: production
      url: https://letsplaydarts.eu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/dartserver-config
          path: dartserver-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Unlock git-crypt (config repo)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "${GIT_CRYPT_KEY}" ]; then
            echo "❌ GIT_CRYPT_KEY secret is missing; cannot decrypt config repository"
            exit 1
          fi
          echo "🔑 Unlocking git-crypt..."
          echo "${GIT_CRYPT_KEY}" | base64 -d > /tmp/git-crypt.key
          cd dartserver-config
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      - name: Decrypt config repository
        run: |
          cd dartserver-config
          chmod +x scripts/decrypt-configs.sh
          ./scripts/decrypt-configs.sh

      - name: Normalize and bundle production config
        run: |
          normalize_env() {
            ENV_PATH="$1"
            if [ -f "$ENV_PATH" ]; then
              TMP_ENV=$(mktemp)
              if iconv -f UTF-8 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              elif iconv -f ISO-8859-1 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              else
                cp "$ENV_PATH" "$TMP_ENV"
              fi
              perl -0777 -pe 's/^\xEF\xBB\xBF//' "$TMP_ENV" > "$ENV_PATH"
              rm -f "$TMP_ENV"
            fi
          }

          normalize_env "dartserver-config/environments/production/.env"

          tar czf /tmp/dartserver-config.tgz -C dartserver-config environments/production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jumphost_key

          cat > ~/.ssh/config << 'SSHCONFIG'
          Host jumphost
            HostName ${{ secrets.JUMPHOST_HOST }}
            User ${{ secrets.JUMPHOST_USER }}
            IdentityFile ~/.ssh/jumphost_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            LogLevel FATAL
            PasswordAuthentication no

          Host prod-server
            HostName ${{ secrets.PROD_SERVER_HOST }}
            Port ${{ secrets.PROD_SERVER_PORT }}
            User ${{ secrets.PROD_SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyJump jumphost
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            LogLevel FATAL
          SSHCONFIG

          chmod 600 ~/.ssh/config

      - name: Send config bundle to production server
        run: |
          if [ ! -f /tmp/dartserver-config.tgz ]; then
            echo "❌ /tmp/dartserver-config.tgz not found"
            exit 1
          fi
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/dartserver-config.tgz prod-server:/tmp/dartserver-config.tgz
          echo "✅ Production config bundle uploaded to prod-server"

      - name: Merge to Production Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch both branches
          git fetch origin main
          git fetch origin test

          # Checkout main and reset to origin/main to avoid divergence
          git checkout main
          git reset --hard origin/main

          # Try fast-forward merge first, fall back to regular merge with unrelated histories
          if ! git merge --ff-only origin/test; then
            git merge --allow-unrelated-histories -m "Merge test into main via GitHub Actions" origin/test
          fi

          # Push using PAT_TOKEN
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git main

      - name: Deploy to Production Server
        env:
          PROD_SERVER_HOST: prod-server
          PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} bash -s << 'ENDSSH'
          set -e
          echo "🚀 Starting deployment to production environment..."

          cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp || \
            { echo "❌ Application directory not found"; exit 1; }

          normalize_env() {
            ENV_PATH="$1"
            if [ -f "$ENV_PATH" ]; then
              TMP_ENV=$(mktemp)
              if iconv -f UTF-8 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              elif iconv -f ISO-8859-1 -t UTF-8 "$ENV_PATH" > "$TMP_ENV" 2>/dev/null; then
                :
              else
                cp "$ENV_PATH" "$TMP_ENV"
              fi
              perl -0777 -pe 's/^\xEF\xBB\xBF//' "$TMP_ENV" > "$ENV_PATH"
              rm -f "$TMP_ENV"
            fi
          }

          # Refresh config bundle from runner
          if [ -f /tmp/dartserver-config.tgz ]; then
            rm -rf dartserver-config
            mkdir -p dartserver-config
            tar xzf /tmp/dartserver-config.tgz -C dartserver-config
          fi

          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose-wso2.yml down || true

          # Pull latest code BEFORE copying config files
          echo "📥 Pulling latest changes from main branch..."
          TARGET_BRANCH="main"
          git fetch origin "${TARGET_BRANCH}"
          # Force-clean local modifications left by previous/manual runs.
          git reset --hard
          git clean -fd
          git checkout -f -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          git clean -fd

          # Copy configuration files from config repository (fresh bundle)
          # This intentionally overrides tracked files (nginx.conf, SSL certs, etc.)
          echo "📝 Copying configuration files from config repository..."
          rm -rf ./wso2is-7-config ./ssl ./nginx
          cp dartserver-config/environments/production/.env ./.env
          mkdir -p ./wso2is-7-config ./ssl ./nginx
          cp -r dartserver-config/environments/production/wso2is-config/. ./wso2is-7-config/
          cp -r dartserver-config/environments/production/ssl/. ./ssl/

          nginx_conf_src=""
          for candidate in \
            dartserver-config/environments/production/nginx/nginx.conf \
            dartserver-config/environments/production/nginx/nginx/nginx.conf; do
            if [ -f "${candidate}" ]; then
              nginx_conf_src="${candidate}"
              break
            fi
          done

          nginx_crt_src=""
          for candidate in \
            dartserver-config/environments/production/nginx/nginx.crt \
            dartserver-config/environments/production/nginx/cert.pem \
            dartserver-config/environments/production/nginx/nginx/nginx.crt \
            dartserver-config/environments/production/nginx/nginx/cert.pem \
            dartserver-config/environments/production/nginx/nginx/ssl/nginx.crt \
            dartserver-config/environments/production/nginx/nginx/ssl/cert.pem; do
            if [ -f "${candidate}" ]; then
              nginx_crt_src="${candidate}"
              break
            fi
          done

          nginx_key_src=""
          for candidate in \
            dartserver-config/environments/production/nginx/nginx.key \
            dartserver-config/environments/production/nginx/key.pem \
            dartserver-config/environments/production/nginx/nginx/nginx.key \
            dartserver-config/environments/production/nginx/nginx/key.pem \
            dartserver-config/environments/production/nginx/nginx/ssl/nginx.key \
            dartserver-config/environments/production/nginx/nginx/ssl/key.pem; do
            if [ -f "${candidate}" ]; then
              nginx_key_src="${candidate}"
              break
            fi
          done

          if [ -z "${nginx_conf_src}" ] || [ -z "${nginx_crt_src}" ] || [ -z "${nginx_key_src}" ]; then
            echo "❌ Could not resolve nginx asset files from config bundle"
            echo "Resolved values: nginx_conf_src='${nginx_conf_src}', nginx_crt_src='${nginx_crt_src}', nginx_key_src='${nginx_key_src}'"
            find dartserver-config/environments/production/nginx -maxdepth 4 -mindepth 1 -ls || true
            exit 1
          fi

          echo "ℹ️ Using nginx assets: conf='${nginx_conf_src}', crt='${nginx_crt_src}', key='${nginx_key_src}'"

          install -m 0644 "${nginx_conf_src}" ./nginx/nginx.conf
          install -m 0644 "${nginx_crt_src}" ./nginx/nginx.crt
          install -m 0644 "${nginx_key_src}" ./nginx/nginx.key
          chmod 0600 ./nginx/nginx.key

          echo "🔧 Normalizing .env encoding to UTF-8 (strip BOM, convert Latin-1 if needed)..."
          normalize_env ".env"

          # Clone or update dartserver-website (sibling directory)
          echo "📦 Setting up dartserver-website..."
          WEBSITE_DIR="$(dirname $(pwd))/dartserver-website"
          if git -C "${WEBSITE_DIR}" rev-parse --git-dir > /dev/null 2>&1; then
            echo "  → Pulling latest dartserver-website..."
            git -C "${WEBSITE_DIR}" fetch origin
            git -C "${WEBSITE_DIR}" checkout main
            git -C "${WEBSITE_DIR}" pull origin main
          else
            echo "  → Cloning dartserver-website..."
            rm -rf "${WEBSITE_DIR}"
            git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/dartserver-website.git "${WEBSITE_DIR}"
          fi

          # Rebuild containers (build services individually to avoid context issues)
          echo "🔨 Rebuilding containers..."
          docker-compose -f docker-compose-wso2.yml build --no-cache darts-app
          docker-compose -f docker-compose-wso2.yml build --no-cache api-gateway

          # Start containers
          echo "▶️  Starting containers..."
          docker-compose -f docker-compose-wso2.yml up -d

          # Wait for services to be healthy
          echo "⏳ Waiting for services to be healthy..."
          sleep 45

          # Upgrade database schema
          echo "🗄️  Upgrading database schema to latest migration..."
          docker-compose -f docker-compose-wso2.yml exec -T darts-app alembic upgrade head

          # Check container status
          echo "✅ Checking container status..."
          docker-compose -f docker-compose-wso2.yml ps

          echo "🎉 Deployment to production environment completed!"
          ENDSSH

      - name: Verify Production Deployment
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} << 'ENDSSH'
            cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

            RUNNING_CONTAINERS=$(docker-compose -f docker-compose-wso2.yml \
              ps --services --filter "status=running" | wc -l)
            echo "Running containers: $RUNNING_CONTAINERS"

            if [ "$RUNNING_CONTAINERS" -lt 1 ]; then
              echo "❌ Not all containers are running"
              exit 1
            fi

            echo "✅ All containers are running"
          ENDSSH

      - name: Health Check
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} << 'ENDSSH'
            cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

            sleep 15

            echo "🏥 Checking application health..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")

            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Application health check passed (HTTP $HEALTH_STATUS)"
            else
              echo "⚠️  Application health check returned HTTP $HEALTH_STATUS"
              echo "Checking logs..."
              docker-compose -f docker-compose-wso2.yml logs --tail=50 darts-app
              exit 1
            fi
          ENDSSH

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/jumphost_key

  restore-on-failure:
    name: Restore Production on Deployment Failure
    runs-on: ubuntu-latest
    needs: [backup-production, deploy-production]
    # Only trigger restore when the production deployment failed AND a backup was created
    if: ${{ needs.deploy-production.result == 'failure' && needs.backup-production.result == 'success' }}
    environment:
      name: production-restore-approval
      # NOTE: Configure with Required Reviewers to approve/skip restore

    steps:
      - name: Wait for Restore Approval
        run: |
          echo "❌ Production deployment failed"
          echo "🔄 Restore from backup is recommended"
          echo ""
          echo "Options:"
          echo "  ✅ Approve - Restore from backup"
          echo "  ⏭️  Reject/Cancel - Skip restore (manual fix needed)"
          echo ""
          echo "Waiting for approval..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jumphost_key

          cat > ~/.ssh/config << 'SSHCONFIG'
          Host jumphost
            HostName ${{ secrets.JUMPHOST_HOST }}
            User ${{ secrets.JUMPHOST_USER }}
            IdentityFile ~/.ssh/jumphost_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            LogLevel FATAL
            PasswordAuthentication no

          Host prod-server
            HostName ${{ secrets.PROD_SERVER_HOST }}
            Port ${{ secrets.PROD_SERVER_PORT }}
            User ${{ secrets.PROD_SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyJump jumphost
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            LogLevel FATAL
          SSHCONFIG

          chmod 600 ~/.ssh/config

      - name: Restore from Backup
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} bash -s << 'ENDSSH'
          set -e
          cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

          echo "🔄 Production deployment failed, restoring from backup..."

          # Get the backup path we created earlier
          BACKUP_PATH=$(cat /tmp/latest_backup_path.txt 2>/dev/null | tr -d '\n')

          if [ -z "$BACKUP_PATH" ] || [ ! -d "$BACKUP_PATH" ]; then
            echo "⚠️  Backup path not found in /tmp, attempting to use latest backup..."
            BACKUP_PATH=$(ls -dt docker-backups/*/ 2>/dev/null | head -1)
          fi

          if [ -z "$BACKUP_PATH" ]; then
            echo "❌ No backups found in docker-backups/ directory"
            exit 1
          fi

          echo "Restoring from: $BACKUP_PATH"

          # Stop containers first
          echo "🛑 Stopping containers..."
          docker-compose -f docker-compose-wso2.yml down || true

          # Restore volumes directly (script may not exist yet)
          echo "📦 Restoring Docker volumes..."

          # Restore postgres_data
          if [ -f "${BACKUP_PATH}/postgres_data.tar.gz" ]; then
            echo "Restoring postgres_data..."
            docker volume rm dartserver-pythonapp_postgres_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_postgres_data
            docker run --rm -v dartserver-pythonapp_postgres_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/postgres_data.tar.gz -C /data
          fi

          # Restore rabbitmq_data
          if [ -f "${BACKUP_PATH}/rabbitmq_data.tar.gz" ]; then
            echo "Restoring rabbitmq_data..."
            docker volume rm dartserver-pythonapp_rabbitmq_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_rabbitmq_data
            docker run --rm -v dartserver-pythonapp_rabbitmq_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/rabbitmq_data.tar.gz -C /data
          fi

          # Restore wso2is_data
          if [ -f "${BACKUP_PATH}/wso2is_data.tar.gz" ]; then
            echo "Restoring wso2is_data..."
            docker volume rm dartserver-pythonapp_wso2is_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_wso2is_data
            docker run --rm -v dartserver-pythonapp_wso2is_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/wso2is_data.tar.gz -C /data
          fi

          # Restore wso2apim_data
          if [ -f "${BACKUP_PATH}/wso2apim_data.tar.gz" ]; then
            echo "Restoring wso2apim_data..."
            docker volume rm dartserver-pythonapp_wso2apim_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_wso2apim_data
            docker run --rm -v dartserver-pythonapp_wso2apim_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/wso2apim_data.tar.gz -C /data
          fi

          # Start containers after restore
          echo "▶️  Starting containers after restore..."
          docker-compose -f docker-compose-wso2.yml up -d

          sleep 30

          echo "✅ Production restored from backup"
          ENDSSH

      - name: Verify Restored Deployment
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} << 'ENDSSH'
            cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

            RUNNING_CONTAINERS=$(docker-compose -f docker-compose-wso2.yml \
              ps --services --filter "status=running" | wc -l)

            if [ "$RUNNING_CONTAINERS" -lt 1 ]; then
              echo "❌ Restore failed - containers not running"
              exit 1
            fi

            echo "✅ Restore successful - all containers running"
          ENDSSH

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/jumphost_key

  verify-production:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    environment:
      name: production-verification

    steps:
      - name: Wait for Verification
        run: |
          echo "✅ Production deployment completed"
          echo "🔍 Please verify the production environment is working correctly"
          echo ""
          echo "Options:"
          echo "  ✅ Approve - Deployment is successful and working properly → Pipeline completes"
          echo "  ⏭️  Reject/Cancel - Skip verification → Pipeline completes (no rollback)"
          echo ""
          echo "Note: If you need rollback, use the rollback-production job manually"
          echo ""
          echo "After verification, choose the appropriate action..."

  rollback-production:
    name: Manual Rollback Production
    runs-on: ubuntu-latest
    needs: [backup-production, verify-production]
    # This job only runs if manually triggered via workflow_dispatch or if verify-production is explicitly rejected
    # Skipping verify-production will NOT trigger rollback
    if: failure() && needs.verify-production.result == 'failure'
    environment:
      name: production-rollback

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.JUMPHOST_SSH_KEY }}" > ~/.ssh/jumphost_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jumphost_key

          cat > ~/.ssh/config << 'SSHCONFIG'
          Host jumphost
            HostName ${{ secrets.JUMPHOST_HOST }}
            User ${{ secrets.JUMPHOST_USER }}
            IdentityFile ~/.ssh/jumphost_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            LogLevel FATAL
            PasswordAuthentication no

          Host prod-server
            HostName ${{ secrets.PROD_SERVER_HOST }}
            Port ${{ secrets.PROD_SERVER_PORT }}
            User ${{ secrets.PROD_SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyJump jumphost
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            LogLevel FATAL
          SSHCONFIG

          chmod 600 ~/.ssh/config

      - name: Confirm Rollback Decision
        run: |
          echo "⚠️  ROLLBACK REQUESTED"
          echo "This will restore production to the previous backup"
          echo "Waiting for final confirmation..."

      - name: Perform Rollback
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} bash -s << 'ENDSSH'
          set -e
          cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

          echo "🔄 Rolling back production to previous state..."

          BACKUP_PATH=$(cat /tmp/latest_backup_path.txt 2>/dev/null | tr -d '\n')

          if [ -z "$BACKUP_PATH" ] || [ ! -d "$BACKUP_PATH" ]; then
            echo "⚠️  Backup path not found, using latest backup..."
            BACKUP_PATH=$(ls -dt docker-backups/*/ 2>/dev/null | head -1)
          fi

          if [ -z "$BACKUP_PATH" ]; then
            echo "❌ No backups found in docker-backups/ directory"
            exit 1
          fi

          echo "Rolling back to: $BACKUP_PATH"

          # Stop containers first
          echo "🛑 Stopping containers..."
          docker-compose -f docker-compose-wso2.yml down || true

          # Restore volumes directly
          echo "📦 Restoring Docker volumes..."

          # Restore postgres_data
          if [ -f "${BACKUP_PATH}/postgres_data.tar.gz" ]; then
            echo "Restoring postgres_data..."
            docker volume rm dartserver-pythonapp_postgres_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_postgres_data
            docker run --rm -v dartserver-pythonapp_postgres_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/postgres_data.tar.gz -C /data
          fi

          # Restore rabbitmq_data
          if [ -f "${BACKUP_PATH}/rabbitmq_data.tar.gz" ]; then
            echo "Restoring rabbitmq_data..."
            docker volume rm dartserver-pythonapp_rabbitmq_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_rabbitmq_data
            docker run --rm -v dartserver-pythonapp_rabbitmq_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/rabbitmq_data.tar.gz -C /data
          fi

          # Restore wso2is_data
          if [ -f "${BACKUP_PATH}/wso2is_data.tar.gz" ]; then
            echo "Restoring wso2is_data..."
            docker volume rm dartserver-pythonapp_wso2is_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_wso2is_data
            docker run --rm -v dartserver-pythonapp_wso2is_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/wso2is_data.tar.gz -C /data
          fi

          # Restore wso2apim_data
          if [ -f "${BACKUP_PATH}/wso2apim_data.tar.gz" ]; then
            echo "Restoring wso2apim_data..."
            docker volume rm dartserver-pythonapp_wso2apim_data 2>/dev/null || true
            docker volume create dartserver-pythonapp_wso2apim_data
            docker run --rm -v dartserver-pythonapp_wso2apim_data:/data -v "$(pwd)/${BACKUP_PATH}":/backup:ro alpine tar xzf /backup/wso2apim_data.tar.gz -C /data
          fi

          echo "▶️  Starting containers after rollback..."
          docker-compose -f docker-compose-wso2.yml up -d

          sleep 30

          echo "✅ Production rolled back successfully"
          ENDSSH

      - name: Verify Rollback
        env:
          PROD_SERVER_HOST: prod-server
        run: |
          ssh -i ~/.ssh/deploy_key ${PROD_SERVER_HOST} << 'ENDSSH'
            cd /opt/dartserver-pythonapp || cd ~/dartserver-pythonapp

            RUNNING_CONTAINERS=$(docker-compose -f docker-compose-wso2.yml \
              ps --services --filter "status=running" | wc -l)

            if [ "$RUNNING_CONTAINERS" -lt 1 ]; then
              echo "❌ Rollback verification failed"
              exit 1
            fi

            echo "✅ Rollback verified - all containers running"
          ENDSSH

      - name: Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/jumphost_key

  cleanup-success:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-production, verify-production]
    # Success if deployment worked, regardless of verification being approved or skipped
    if: |
      always() &&
      needs.deploy-production.result == 'success' &&
      (needs.verify-production.result == 'success' || needs.verify-production.result == 'cancelled' || needs.verify-production.result == 'skipped')

    steps:
      - name: Success Notification
        run: |
          if [ "${{ needs.verify-production.result }}" == "success" ]; then
            echo "🎉 Production deployment completed and verified successfully!"
          else
            echo "✅ Production deployment completed (verification skipped)"
          fi
          echo "📊 Deployment pipeline finished"
