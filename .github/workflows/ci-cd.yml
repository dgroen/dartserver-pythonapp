name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        package: ['dartserver-core', 'dartserver-games', 'dartserver-services', 'dartserver-app']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: packages/${{ matrix.package }}
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      working-directory: packages/${{ matrix.package }}
      run: ruff check src/ tests/
    
    - name: Type check with mypy
      working-directory: packages/${{ matrix.package }}
      run: mypy src/ tests/ --ignore-missing-imports || true
    
    - name: Format check with black
      working-directory: packages/${{ matrix.package }}
      run: black --check src/ tests/ || true
    
    - name: Run tests
      working-directory: packages/${{ matrix.package }}
      run: pytest tests/ -v --cov=src/ --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.package }}-py${{ matrix.python-version }}

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security check
      run: bandit -r packages/*/src/ -f json -o bandit-report.json || true
    
    - name: Check dependencies with Safety
      run: |
        for pkg in packages/*/; do
          echo "Checking $pkg..."
          cd "$pkg"
          safety check --json || true
          cd - > /dev/null
        done

  publish:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    strategy:
      matrix:
        package: ['dartserver-core', 'dartserver-games', 'dartserver-services', 'dartserver-app']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: pip install build twine
    
    - name: Build package
      working-directory: packages/${{ matrix.package }}
      run: python -m build
    
    - name: Publish to PyPI
      working-directory: packages/${{ matrix.package }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/* --skip-existing
