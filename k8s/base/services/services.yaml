---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: darts-app
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: darts-app
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: 15672
    targetPort: 15672
    protocol: TCP
    name: management
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: wso2is-service
  namespace: darts-app
  labels:
    app: wso2is
spec:
  type: ClusterIP
  ports:
  - port: 9443
    targetPort: 9443
    protocol: TCP
    name: https
  - port: 9763
    targetPort: 9763
    protocol: TCP
    name: http
  selector:
    app: wso2is
---
apiVersion: v1
kind: Service
metadata:
  name: darts-app-service
  namespace: darts-app
  labels:
    app: darts-app
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: darts-app
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: darts-app
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
