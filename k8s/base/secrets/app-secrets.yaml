---
# This is a template for secrets. In production, use sealed-secrets or external secrets operator
# DO NOT commit actual secrets to git
apiVersion: v1
kind: Secret
metadata:
  name: darts-app-secrets
  namespace: darts-app
  labels:
    app: darts-game
type: Opaque
stringData:
  # Flask Secret Key (generate a strong random key for production)
  SECRET_KEY: "change-this-in-production-use-strong-random-key"
  
  # RabbitMQ Credentials
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  
  # Database Credentials
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "postgres"
  
  # WSO2 Credentials
  WSO2_CLIENT_ID: "your_client_id_here"
  WSO2_CLIENT_SECRET: "your_client_secret_here"
  WSO2_IS_INTROSPECT_USER: "admin"
  WSO2_IS_INTROSPECT_PASSWORD: "admin"
  WSO2_REDIRECT_URI: "https://letsplaydarts.eu/callback"
  WSO2_POST_LOGOUT_REDIRECT_URI: "https://letsplaydarts.eu/"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: darts-app
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "dartsdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: darts-app
  labels:
    app: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
