apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: darts-app

# Resources to deploy
resources:
  - base/namespace/namespace.yaml
  - base/configmaps/app-config.yaml
  - base/secrets/app-secrets.yaml
  - base/pvcs/storage.yaml
  - base/statefulsets/postgres.yaml
  - base/statefulsets/rabbitmq.yaml
  - base/deployments/wso2is.yaml
  - base/deployments/darts-app.yaml
  - base/deployments/api-gateway.yaml
  - base/services/services.yaml
  - hpa/hpa.yaml
  - ingress/ingress.yaml
  - network-policies/network-policies.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: darts-app
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  contact: "devops@letsplaydarts.eu"
  documentation: "https://github.com/dgroen/dartserver-pythonapp"

# Images to use (can be overridden with kustomize edit set image)
images:
  - name: darts-app
    newName: darts-app
    newTag: latest
  - name: api-gateway
    newName: api-gateway
    newTag: latest

# ConfigMap generator for runtime configuration
configMapGenerator:
  - name: runtime-config
    literals:
      - DEPLOYMENT_TIME=$(date +%Y-%m-%d_%H:%M:%S)
      - VERSION=1.0.0

# Patches for environment-specific customizations
patches:
  - target:
      kind: Deployment
      name: darts-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEPLOYMENT_ENV
          value: "kubernetes"
